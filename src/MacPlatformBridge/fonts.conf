<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The recovered stable client ships its UI faces next to the executable.
       The macOS port deliberately uses Pango's FreeType/fontconfig backend,
       so CoreText process registration alone is not enough. -->
  <dir prefix="cwd">Fonts</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- stable requests Windows UI families when rasterising dynamic labels. -->
  <alias><family>Arial</family><prefer><family>Helvetica</family><family>Arial</family></prefer></alias>
  <alias><family>Tahoma</family><prefer><family>Helvetica</family></prefer></alias>
  <alias><family>Verdana</family><prefer><family>Helvetica</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Helvetica</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Helvetica</family><family>Arial</family></prefer></alias>
</fontconfig>
